<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The 11:59 Club — Book One: The Last Train to Nowhere</title>
  <meta name="description" content="A Choose-Your-Scare interactive horror adventure for ages 8–12 by E.G. Lopez. Can you escape the platform at 11:59?">
  <meta name="theme-color" content="#0b0c10">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Optional Web Analytics (Uncomment & replace YOUR_TRACKING_ID to enable GA4 or GoatCounter) -->
  <!-- 
  <script async src="https://www.googletagmanager.com/gtag/js?id=YOUR_GA4_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'YOUR_GA4_ID');
  </script>
  -->
</head>
<body>

  <main class="stage">
    <!-- Signature Header Component: 11:59 Retro Digital Station Clock & Controls -->
    <header class="header-clock-container" aria-label="Station Header">
      <div class="clock-brand">
        <svg class="clock-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/>
        </svg>
        <span class="clock-brand-title">THE 11:59 CLUB</span>
      </div>

      <div class="header-controls">
        <div class="icon-btn visitor-badge" id="visitorBadge" title="Total Passengers Boarded across all visits" aria-label="Total Passengers Boarded">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span>Boarded: <strong id="visitorCountVal">...</strong></span>
        </div>
        <button class="icon-btn" id="trackerBtn" aria-label="View Collected Endings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <span>Endings: 0/9</span>
        </button>
        <button class="icon-btn" id="muteBtn" aria-label="Audio Controls">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <span>Audio On</span>
        </button>
      </div>
    </header>

    <!-- Interactive Game Board Container -->
    <section class="board" id="board" aria-label="Story Scene Board">
      <!-- Dynamic content rendered by JS -->
    </section>

    <footer class="footer-note">
      Book One — The Last Train to Nowhere — Author Credit: E.G. Lopez
    </footer>
  </main>

  <!-- Modal Gallery for Endings Tracker -->
  <div class="modal-backdrop" id="endingsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">
          <svg viewBox="0 0 24 24" style="width:18px; height:18px; fill:currentColor;"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          Endings Collected
        </h2>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close Endings Gallery">&times;</button>
      </div>
      <div class="modal-body">
        <div class="endings-grid" id="endingsGrid">
          <!-- Rendered dynamically by app.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="audioLoop" loop preload="none"></audio>
  <audio id="audioStab" preload="none"></audio>

  <!-- Main JavaScript Engine -->
  <script src="js/app.js"></script>
</body>
</html>
